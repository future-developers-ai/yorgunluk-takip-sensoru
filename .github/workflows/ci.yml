name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sistem kutuphaneleri (mediapipe icin)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - name: Kurulum
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . --select E4,E7,E9,F
      - name: Model
        run: python scripts/get_model.py
      - name: pytest
        run: python -m pytest
